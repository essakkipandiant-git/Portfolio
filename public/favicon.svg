<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B2" />
      <stop offset="50%" stop-color="#E2B774" />
      <stop offset="100%" stop-color="#BA8738" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B774" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9C6F2A" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  <!-- Accent Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
  <!-- Monogram EP -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Space Grotesk', sans-serif" font-size="27" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">EP</text>
</svg>
